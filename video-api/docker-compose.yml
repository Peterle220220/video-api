services:
  # Video API Application
  api:
    build:
      context: ..
      dockerfile: video-api/Dockerfile
    container_name: video_api_app
    # Resource limits to prevent EC2 crash
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ~/.aws:/home/node/.aws:ro
    environment:
      - NODE_ENV=development
      - SKIP_SSM=${SKIP_SSM:-1}
      - AWS_REGION=ap-southeast-2
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      # Local paths removed to promote statelessness; use S3 for persistence
      # - UPLOAD_PATH=./uploads
      # - PROCESSED_PATH=./processed
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-500MB}
      - CPU_MONITORING_INTERVAL=${CPU_MONITORING_INTERVAL:-1000}
      - FFMPEG_THREADS=${FFMPEG_THREADS:-1}
      - FFMPEG_PRESET=${FFMPEG_PRESET:-ultrafast}
      - FFMPEG_CRF=${FFMPEG_CRF:-28}
      - FFMPEG_FPS=${FFMPEG_FPS:-24}
      - DEFAULT_RESOLUTIONS=${DEFAULT_RESOLUTIONS:-["854x480"]}
      - S3_BUCKET=cab432-a2-n12122882
      - DDB_TABLE=cab432-a2-n12122882-metadata
      - QUT_USERNAME=n12122882
      - ASSEMBLYAI_API_KEY=420c9f6d29f742e587313b9764794f45
      - SQS_TRANSCODE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcode-queue
      - SQS_TRANSCRIBE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcribe-queue
      - SQS_TRANSCODE_DLQ_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcode-dlq
      - SQS_TRANSCRIBE_DLQ_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcribe-dlq
      - COGNITO_USER_POOL_ID=ap-southeast-2_1234567890
      - COGNITO_CLIENT_ID=1o00oog3qb82t1qgvi62lfv9fa
      - COGNITO_CLIENT_SECRET=1oftmplton69rcfvg4egrme6ia2vkheebc9u7u1im9l6gqdf48ql
      - COGNITO_JWKS_URI=https://cognito-idp.ap-southeast-2.amazonaws.com/ap-southeast-2_wgTgFFTuB/.well-known/jwks.json
    ports:
      - "3000:3000"
    # Remove bind mounts to avoid local persistent state
    # volumes:
    #   - ./uploads:/app/uploads
    #   - ./processed:/app/processed
    depends_on: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/health'', r => process.exit(r.statusCode===200?0:1))" ',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Transcoder Worker (FFmpeg)
  transcoder-worker:
    build:
      context: ..
      dockerfile: transcoder-worker/Dockerfile
    container_name: transcoder_worker
    # Resource limits for transcoder worker
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    environment:
      - SERVICE_NAME=transcoder-worker
      - AWS_REGION=ap-southeast-2
      - SQS_TRANSCODE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcode-queue
      - S3_BUCKET=cab432-a2-n12122882
      - S3_INPUT_BUCKET=cab432-a2-n12122882
      - S3_OUTPUT_BUCKET=cab432-a2-n12122882
      - DDB_TABLE_VIDEOS=cab432-a2-n12122882-videos
      - FFMPEG_PRESET=${FFMPEG_PRESET:-ultrafast}
      - FFMPEG_CRF=${FFMPEG_CRF:-28}
    depends_on: {}

  # Transcribe Worker (AssemblyAI)
  transcribe-worker:
    build:
      context: ..
      dockerfile: transcribe-worker/Dockerfile
    container_name: transcribe_worker
    # Resource limits for transcribe worker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    environment:
      - SERVICE_NAME=transcribe-worker
      - AWS_REGION=ap-southeast-2
      - SQS_TRANSCRIBE_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcribe-queue
      - S3_BUCKET=cab432-a2-n12122882
      - S3_INPUT_BUCKET=cab432-a2-n12122882
      - DDB_TABLE_VIDEOS=cab432-a2-n12122882-videos
      - ASSEMBLYAI_API_KEY=420c9f6d29f742e587313b9764794f45
    depends_on: {}

  # DLQ Handler (optional but recommended)
  dlq-handler:
    build:
      context: ..
      dockerfile: dlq-handler/Dockerfile
    container_name: dlq_handler
    # Resource limits for DLQ handler
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    volumes:
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    environment:
      - SERVICE_NAME=dlq-handler
      - AWS_REGION=ap-southeast-2
      - SQS_TRANSCODE_DLQ_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcode-dlq
      - SQS_TRANSCRIBE_DLQ_URL=https://sqs.ap-southeast-2.amazonaws.com/901444280953/video-transcribe-dlq
      - DDB_TABLE_VIDEOS=cab432-a2-n12122882-videos
    depends_on: {}

  # Load generator using k6 to drive CPU test for 5 minutes
  load:
    image: grafana/k6:0.49.0
    container_name: video_api_load
    depends_on:
      api:
        condition: service_healthy
    environment:
      - K6_OUT=csv=/scripts/k6_results.csv
      - API_BASE=http://api:3000
      - AUTH_TOKEN=${AUTH_TOKEN:-REPLACE_WITH_YOUR_TOKEN}
      - TEST_DURATION=5m
      - VUS=5
    volumes:
      - ./scripts:/scripts
    entrypoint: ["k6", "run", "/scripts/test-cpu.js"]

  # Dockerized encoder load (no Node) that uploads sample.mp4 repeatedly for 5 minutes
  load-encode:
    image: alpine:3.19
    container_name: video_api_encode_load
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE=http://api:3000
      - USERNAME=${LOAD_USERNAME:-admin}
      - PASSWORD=${LOAD_PASSWORD:-admin123}
      - MINUTES=${LOAD_MINUTES:-5}
      - VUS=${LOAD_VUS:-2}
      - SLEEP_BETWEEN=${LOAD_SLEEP:-1}
      - VIDEO_PATH=/app/sample.mp4
    volumes:
      - ./scripts:/scripts:ro
      - ./sample.mp4:/app/sample.mp4:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "apk add --no-cache bash jq curl > /dev/null && bash /scripts/cpu-load.sh --mode transcode --heavy --api-base $${API_BASE} --user $${USERNAME} --pass $${PASSWORD} --minutes $${MINUTES} --vus $${VUS} --sleep $${SLEEP_BETWEEN} --video $${VIDEO_PATH}",
      ]

volumes: {}
